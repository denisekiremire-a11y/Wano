<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>You're offline — Wano</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: #f4f8fc;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #1b3a5c;
    text-align: center;
    padding: 24px;
  }
  .mark {
    width: 56px;
    height: 56px;
    border-radius: 16px;
    background: linear-gradient(135deg, #1b3a5c 0%, #2c4a6e 55%, #b79b72 130%);
    color: #b79b72;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    font-weight: 800;
  }
  h1 { font-size: 20px; margin: 0; }
  p { margin: 0; color: rgba(27, 58, 92, 0.7); font-size: 14px; max-width: 320px; }
  button {
    margin-top: 8px;
    border: none;
    border-radius: 999px;
    background: #2c4a6e;
    color: white;
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
</style>
</head>
<body>
  <span class="mark">W</span>
  <h1>You're offline</h1>
  <p>Wano needs a connection to load places, bookings, and rewards. Check your connection and try again.</p>
  <button onclick="location.reload()">Retry</button>
</body>
</html>
