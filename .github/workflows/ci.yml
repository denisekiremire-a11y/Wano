name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    # The RLS and slot-booking suites hit a real database (they prove
    # Postgres policies hold with zero application code involved, and
    # exercise the advisory-lock booking flow) — same throwaway-Postgres
    # setup as the build job below, plus the hand-written RLS migrations
    # (not schema.ts-declared, so drizzle-kit push doesn't apply them) and
    # seed data the tests assume exists.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wano_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/wano_ci
      AUTH_SECRET: ci-only-not-a-real-secret
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx drizzle-kit push --force
      - name: Apply RLS policies (not schema.ts-declared)
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f drizzle/manual_rls_round_a.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f drizzle/manual_rls_round_b.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f drizzle/manual_admin_action_log.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f drizzle/manual_rewards_v2.sql
      - run: npm run db:seed
      - run: npm run db:seed:wano
      - run: npm test

  build:
    runs-on: ubuntu-latest
    # `next build` prerenders the sitemap and other static pages from the
    # database, so the build runs against a throwaway Postgres with the
    # current schema pushed (same as `npm run db:push` in the README).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wano_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/wano_ci
      AUTH_SECRET: ci-only-not-a-real-secret
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx drizzle-kit push --force
      - run: npm run build
