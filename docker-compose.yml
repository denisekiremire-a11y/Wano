services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pamoja2027
    ports:
      - "5432:5432"
    volumes:
      - pamoja_pgdata:/var/lib/postgresql/data

volumes:
  pamoja_pgdata:
